[project]
name = "aws-saa-mcp"
version = "0.1.0"
description = "AWS SAA-C03 question bank MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aws-saa-server      = "server.mcp_server:main"
aws-saa-server-http = "server.mcp_server:main_http"
aws-saa-scrape      = "scraper.examtopics:main"
aws-saa-seed        = "db.seed:main"
aws-saa-embed       = "embeddings.search:build_index"
aws-saa-qmd         = "scraper.parse_qmd:main"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "db", "embeddings", "server", "domain_mapping"]
